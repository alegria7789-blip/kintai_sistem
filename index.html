<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠打刻フォーム</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input, button { width: 100%; padding: 10px; box-sizing: border-box; font-size: 16px; }
    button { background-color: #07c755; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    .error-msg { color: red; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>

  <h2>勤怠打刻</h2>
  <form id="attendanceForm">
    
    <!-- 名前選択 -->
    <div class="form-group">
      <label for="name">名前</label>
      <select id="name" required>
        <option value="">選択してください</option>
        <option value="あ">あ</option>
        <option value="い">い</option>
      </select>
    </div>

    <!-- 4桁PIN入力 -->
    <div class="form-group">
      <label for="pin">暗証番号 (4桁PIN)</label>
      <input type="password" id="pin" maxlength="4" pattern="\d{4}" inputmode="numeric" placeholder="1234" requiredautocomplete="off">
    </div>

    <!-- 打刻項目 -->
    <div class="form-group">
      <label for="date">日付</label>
      <input type="date" id="date" required>
    </div>

    <div class="form-group">
      <label for="startTime">出勤時間</label>
      <input type="time" id="startTime" required>
    </div>

    <div class="form-group">
      <label for="endTime">退勤時間</label>
      <input type="time" id="endTime" required>
    </div>

    <div class="form-group">
      <label for="restMinutes">休憩時間 (分)</label>
      <input type="number" id="restMinutes" value="60" min="0">
    </div>

    <div class="form-group">
      <label for="transportation">交通費 (円)</label>
      <input type="number" id="transportation" value="0" min="0">
    </div>

    <div class="form-group">
      <label for="reimbursement">立替金 (円)</label>
      <input type="number" id="reimbursement" value="0" min="0">
    </div>

    <div class="form-group">
      <label for="otherAdjustment">その他増減給 (円)</label>
      <input type="number" id="otherAdjustment" value="0">
    </div>

    <button type="submit" id="submitBtn">送信する</button>
  </form>

  <div id="message" class="error-msg"></div>

  <script>
    // ★ご自身のGAS WebアプリURLに差し替えてください
    const GAS_URL = "YOUR_GAS_DEPLOY_URL_HERE";

    // 画面ロード時の初期処理
    document.addEventListener("DOMContentLoaded", () => {
      // 本日の日付をデフォルトセット
      const today = new Date().toISOString().split('T')[0];
      document.getElementById("date").value = today;

      // localStorageから前回の名前を復元
      const savedName = localStorage.getItem("attendance_user_name");
      if (savedName) {
        document.getElementById("name").value = savedName;
      }
    });

    // フォーム送信処理
    document.getElementById("attendanceForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      const messageDiv = document.getElementById("message");
      messageDiv.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中...";

      const selectedDate = document.getElementById("date").value; // "YYYY-MM-DD"
      const dateParts = selectedDate.split("-");

      const selectedName = document.getElementById("name").value;
      const inputPin = document.getElementById("pin").value;

      // 名前をlocalStorageに保存（次回用）
      localStorage.setItem("attendance_user_name", selectedName);

      // 時間計算ロジック（簡易計算例）
      const startTime = document.getElementById("startTime").value;
      const endTime = document.getElementById("endTime").value;
      const restMin = Number(document.getElementById("restMinutes").value) || 0;

      let workHours = 0;
      let overtimeHours = 0;
      if (startTime && endTime) {
        const start = new Date(`${selectedDate}T${startTime}`);
        const end = new Date(`${selectedDate}T${endTime}`);
        const diffDiff = (end - start) / (1000 * 60 * 60); // 時間換算
        const actualWork = Math.max(0, diffDiff - (restMin / 60));
        workHours = Math.round(actualWork * 100) / 100;
        overtimeHours = Math.max(0, Math.round((workHours - 8) * 100) / 100);
      }

      const payload = {
        name: selectedName,
        pin: inputPin,
        year: dateParts[0],
        month: dateParts[1],
        date: selectedDate,
        startTime: startTime,
        endTime: endTime,
        restMinutes: restMin,
        workHours: workHours,
        overtimeHours: overtimeHours,
        midnightHours: 0,
        specialHours1: 0,
        specialHours2: 0,
        reimbursement: document.getElementById("reimbursement").value,
        transportation: document.getElementById("transportation").value,
        otherAdjustment: document.getElementById("otherAdjustment").value,
        memo: ""
      };

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          alert("✅ " + result.message);
          // PIN入力欄のみクリア
          document.getElementById("pin").value = "";
        } else {
          alert("⚠️ " + result.message);
        }
      } catch (err) {
        alert("❌ 通信エラーが発生しました。ネットワーク状況を確認してください。");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "送信する";
      }
    });
  </script>
</body>
</html>
